project_id = "lgcxyxyidoirqmbdlldh"

# delete-user exige JWT válido no gateway (defesa em profundidade) — além do
# guard interno requireUser, que também bloqueia o cargo "parcerias".
[functions.delete-user]
verify_jwt = true

# Webhook do TakeatOS: quem prova a origem e a assinatura HMAC do corpo, nao o JWT
# do gateway. Exigir JWT aqui obrigaria o TakeatOS a carregar tambem a anon key do
# Hub, sem ganho de seguranca: a assinatura ja e o controle de acesso.
[functions.recargas-takeatos-webhook]
verify_jwt = false

# Volta do consentimento do Google: quem chega aqui e o NAVEGADOR da pessoa,
# redirecionado pelo Google, sem a anon key do Supabase. Com verify_jwt ligado a
# chamada morre em 401 no gateway e o refresh token nunca e gravado.
# Quem protege este passo e o `state` — um valor aleatorio que a propria funcao
# gerou e guardou em internal_secrets; sem ele, a troca do codigo e recusada. As
# demais acoes da funcao (montar o link, diagnosticar) exigem usuario logado.
[functions.gmail-oauth]
verify_jwt = false

# Tem caminho de cron por `x-cron-token` (sem JWT). Sem esta linha a CLI sobe
# com verify_jwt = true e o cron passa a ser recusado no gateway, calado.
[functions.notas-arquivar]
verify_jwt = false

# Mesma razao: roda de cron (:40) com `x-cron-token`. Sem esta linha o gateway
# devolve UNAUTHORIZED_NO_AUTH_HEADER antes de a funcao existir — e o cron
# falharia sem nada no log da funcao, que e o jeito mais lento de descobrir.
[functions.nota-baixar-link]
verify_jwt = false

# Roda de cron (:35) com `x-cron-token`, como a nota-baixar-link. Sem esta linha
# o gateway devolve UNAUTHORIZED_NO_AUTH_HEADER antes de a funcao existir.
[functions.nota-ler-arquivo]
verify_jwt = false

# Tem caminho de cron (7h) para escrever o diagnostico da manha.
[functions.notas-diagnostico]
verify_jwt = false
