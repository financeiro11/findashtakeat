[functions.integracoes-status]
verify_jwt = false

# Roda de cron (9h UTC) com `x-cron-token` e SEM Authorization — ver a migration
# `20260831093000`. A linha nao e nova na pratica: a funcao ja estava com
# verify_jwt = false no projeto hospedado, so nao estava escrita aqui. Sem ela,
# o primeiro deploy pela CLI ligaria a checagem do gateway e a varredura das 9h
# passaria a morrer em UNAUTHORIZED_NO_AUTH_HEADER, sem nada no log da funcao.
[functions.editais-sync]
verify_jwt = false

# Espelha a agenda do Google para `agenda_eventos`. Roda de cron duas vezes por
# dia (9h e 18h UTC) com `x-cron-token`. Nasceu com verify_jwt = true, e por isso
# os dois disparos diarios morreriam no gateway antes de a funcao existir — o
# mesmo defeito que este arquivo ja documenta seis vezes. Achado ao revisar as
# edge functions em 31/08/2026, antes de o primeiro cron ter chance de falhar.
[functions.agenda-sync]
verify_jwt = false

# O vigia de series, que alimenta o sino. Roda de cron (07:10 UTC) com
# `x-cron-token` e sem Authorization. Caiu na mesma armadilha que este arquivo ja
# documenta cinco vezes: subiu com verify_jwt = true e o primeiro disparo voltou
# UNAUTHORIZED_NO_AUTH_HEADER, com NADA no log da funcao porque ela nem chegou a
# rodar. Quem autoriza de verdade e a propria funcao — `x-cron-token` conferido
# contra internal_cron_tokens, ou requireUser para quem chama pela tela.
[functions.vigia-series]
verify_jwt = false

# =============================================================================
# AS FUNCOES DE IA QUE NUNCA TINHAM SIDO PUBLICADAS PELA CLI.
#
# Todas as linhas abaixo estao com verify_jwt = false NO PROJETO HOSPEDADO desde
# que nasceram — foram criadas por outro caminho, e este arquivo nunca soube
# delas. Enquanto ninguem rodava `functions deploy` nelas, isso nao doia. Passou
# a doer em 03/09/2026, quando o medidor de consumo entrou em
# `_shared/openai.ts` e as dezesseis precisaram subir de uma vez: sem estas
# linhas a CLI as publicaria com verify_jwt = true, ligando no gateway uma
# checagem que elas nunca tiveram.
#
# O QUE QUEBRARIA, e nao e teorico: `disparar_automacao` manda Content-Type,
# os headers extras do agendamento e o `x-cron-token` — NUNCA um `Authorization`.
# Os crons que passam `apikey` passam a apikey, que o gateway nao le como JWT.
# Entao hub-novidades-sync, assinaturas-sheet-sync e companhia morreriam em
# UNAUTHORIZED_NO_AUTH_HEADER, com NADA no log da funcao porque ela nem chega a
# rodar — o defeito que este arquivo ja documenta oito vezes.
#
# As chamadas pela tela nao dependem disto: cada uma dessas funcoes confere a
# pessoa por dentro (requireUser / supabase.auth.getUser do proprio token). O
# que se escreve aqui e o ESTADO ATUAL, nao uma decisao nova de seguranca —
# endurecer o gateway destas rotas e uma mudanca a se fazer de proposito, uma
# por uma, e nao de carona num deploy de instrumentacao.

