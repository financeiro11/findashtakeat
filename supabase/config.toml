project_id = "lgcxyxyidoirqmbdlldh"

# delete-user exige JWT válido no gateway (defesa em profundidade) — além do
# guard interno requireUser, que também bloqueia o cargo "parcerias".
[functions.delete-user]
verify_jwt = true

# Webhook do TakeatOS: quem prova a origem e a assinatura HMAC do corpo, nao o JWT
# do gateway. Exigir JWT aqui obrigaria o TakeatOS a carregar tambem a anon key do
# Hub, sem ganho de seguranca: a assinatura ja e o controle de acesso.
[functions.recargas-takeatos-webhook]
verify_jwt = false

# Volta do consentimento do Google: quem chega aqui e o NAVEGADOR da pessoa,
# redirecionado pelo Google, sem a anon key do Supabase. Com verify_jwt ligado a
# chamada morre em 401 no gateway e o refresh token nunca e gravado.
# Quem protege este passo e o `state` — um valor aleatorio que a propria funcao
# gerou e guardou em internal_secrets; sem ele, a troca do codigo e recusada. As
# demais acoes da funcao (montar o link, diagnosticar) exigem usuario logado.
[functions.gmail-oauth]
verify_jwt = false

# Tem caminho de cron por `x-cron-token` (sem JWT). Sem esta linha a CLI sobe
# com verify_jwt = true e o cron passa a ser recusado no gateway, calado.
[functions.notas-arquivar]
verify_jwt = false

# Mesma razao: roda de cron (:40) com `x-cron-token`. Sem esta linha o gateway
# devolve UNAUTHORIZED_NO_AUTH_HEADER antes de a funcao existir — e o cron
# falharia sem nada no log da funcao, que e o jeito mais lento de descobrir.
[functions.nota-baixar-link]
verify_jwt = false

# Roda de cron (:35) com `x-cron-token`, como a nota-baixar-link. Sem esta linha
# o gateway devolve UNAUTHORIZED_NO_AUTH_HEADER antes de a funcao existir.
[functions.nota-ler-arquivo]
verify_jwt = false

# Tem caminho de cron (7h) para escrever o diagnostico da manha.
[functions.notas-diagnostico]
verify_jwt = false

# Roda de cron (07:40 BRT) com `x-cron-token` para montar o painel de noticias do
# briefing. Cair nesta armadilha custou uma rodada: sem a linha, a CLI sobe com
# verify_jwt = true, `disparar_automacao` nao manda Authorization (so o
# x-cron-token) e o gateway devolve UNAUTHORIZED_NO_AUTH_HEADER — 401 no
# net._http_response e NADA no log da funcao, porque ela nem chegou a rodar.
[functions.briefing-noticias]
verify_jwt = false

# Tem caminho por `x-cron-token` para quem opera de fora do navegador. Sem esta
# linha a CLI sobe com verify_jwt = true e o gateway devolve
# UNAUTHORIZED_NO_AUTH_HEADER antes de a funcao existir.
[functions.omie-anexo-remover]
verify_jwt = false

# Roda de cron (09:20 UTC) com `x-cron-token`, e o agendamento em
# `20260827450000` manda `'{}'::jsonb` de headers extras — ou seja, SEM
# Authorization. As duas metades so fecham com esta linha: nasceu com
# verify_jwt = true e passou desde 27/08 devolvendo UNAUTHORIZED_NO_AUTH_HEADER,
# com nada no log da funcao porque ela nunca chegou a rodar.
[functions.vigilancia-mudancas]
verify_jwt = false

# Mesma dupla e mesma migracao: cron semanal (segunda, 12:10 UTC) com
# `x-cron-token` e sem Authorization. E semanal, entao o 401 dele so apareceria
# na segunda seguinte — foi consertado junto por ser o mesmo defeito, nao por ja
# ter falhado.
[functions.churn-sinal-externo]
verify_jwt = false

# As duas perguntas da IA sobre o acervo de notas. Roda de cron com
# `x-cron-token`, e a linha nasce junto com a funcao de propósito — foi a falta
# dela que deixou `vigilancia-mudancas` dois dias em 401 no gateway.
[functions.notas-explicar]
verify_jwt = false

# Le a falha do cron e escreve a causa. Roda de cron com `x-cron-token`.
[functions.automacoes-diagnosticar]
verify_jwt = false

# `sugerir` roda de cron com `x-cron-token`; `enviar` exige pessoa logada e faz
# essa checagem DENTRO da funcao (requireUser), porque e-mail que sai nao se
# desfaz. verify_jwt = false aqui e para o caminho do cron, nao para o do envio.
[functions.email-responder]
verify_jwt = false
